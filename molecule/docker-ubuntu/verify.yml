---
- name: Verify
  hosts: all
  become: yes
  tasks:
    - name: Check vector binary exists
      stat:
        path: /usr/bin/vector
      register: vector_binary
    
    - name: Assert vector binary is present
      assert:
        that:
          - vector_binary.stat.exists
        fail_msg: "Vector binary not found"
    
    - name: Check vector service is running
      systemd:
        name: vector
      register: vector_service
      ignore_errors: yes
    
    - name: Assert vector service is running
      assert:
        that:
          - vector_service.status.ActiveState == "active"
        fail_msg: "Vector service is not running"
      when: vector_service.status is defined
